<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لوحة الطلبات | ألوان</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <header>
    <div>
      <strong>ألوان</strong>
      <h1>لوحة الطلبات</h1>
    </div>
    <button id="logout" type="button" hidden>تسجيل الخروج</button>
  </header>
  <main>
    <section id="login" class="panel">
      <h2>تسجيل دخول الإدارة</h2>
      <form id="loginForm">
        <label>كلمة المرور<input id="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">دخول</button>
        <p id="loginError" role="alert"></p>
      </form>
    </section>
    <section id="ordersView" hidden>
      <section id="previewReviews" class="panel" hidden aria-labelledby="previewReviewsTitle">
        <h2 id="previewReviewsTitle">معاينات بانتظار مراجعة الصورة</h2>
        <div id="previewReviewList"></div>
      </section>
      <div class="toolbar">
        <label>بحث<input id="search" type="search" placeholder="الاسم أو رقم الطلب أو الجوال"></label>
        <select id="statusFilter" aria-label="تصفية حسب الحالة">
          <option value="">كل الحالات</option>
          <option value="new">جديد</option>
          <option value="preparing">قيد التحضير</option>
          <option value="ready">جاهز</option>
          <option value="delivered">تم التسليم</option>
          <option value="cancelled">ملغي</option>
        </select>
        <button id="refreshOrders" type="button">تحديث الطلبات</button>
      </div>
      <p id="dashboardMessage" role="status" aria-live="polite"></p>
      <div class="stats">
        <article><b id="totalCount">0</b><span>إجمالي الطلبات</span></article>
        <article><b id="newCount">0</b><span>طلبات جديدة</span></article>
        <article><b id="readyCount">0</b><span>جاهزة للتسليم</span></article>
      </div>
      <div class="table-wrap">
        <table>
          <caption class="sr-only">الطلبات المسجلة</caption>
          <thead><tr><th>رقم الطلب</th><th>العميل</th><th>الأطفال</th><th>الإجمالي</th><th>الحالة</th><th>إشعار البريد</th><th>التاريخ</th><th></th></tr></thead>
          <tbody id="orders"></tbody>
        </table>
      </div>
    </section>
  </main>
  <dialog id="orderDialog" aria-labelledby="orderTitle">
    <button id="closeDialog" type="button" class="close" aria-label="إغلاق">×</button>
    <div id="orderDetails"></div>
  </dialog>
  <template id="storyTools">
    <section class="story-tools" aria-label="أدوات القصة">
      <h4>أدوات توليد القصة</h4>
      <label>نوع القصة
        <select class="story-theme">
          <option value="adventure">مغامرة</option>
          <option value="friendship">صداقة وتعاون</option>
          <option value="discovery">اكتشاف وتعلّم</option>
        </select>
      </label>
      <button class="generate-story" type="button">توليد القصة</button>
      <textarea class="story-output" rows="8" placeholder="ستظهر القصة هنا ويمكنك تعديلها." aria-label="القصة المولّدة"></textarea>
      <div class="story-actions">
        <button class="save-story" type="button" disabled>حفظ القصة</button>
        <button class="copy-story" type="button" disabled>نسخ القصة</button>
        <button class="download-story" type="button" disabled>تنزيل القصة</button>
      </div>
    </section>
  </template>
  <script src="dashboard.js"></script>
</body>
</html>
